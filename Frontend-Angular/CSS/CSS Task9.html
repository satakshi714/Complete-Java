<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
    <link rel="stylesheet" href="CSS Task9.css">
</head>
<body>

<div class="container">

    <form class="card">

        <h2>Contact Us</h2>

        <div class="row">
            <div class="field">
                <label>First Name *</label>
                <input type="text">
            </div>

            <div class="field">
                <label>Last Name *</label>
                <input type="text">
            </div>
        </div>

        <label>Email Address *</label>
        <input type="email">

        <label>Query Type *</label>
        <div class="row">
            <label class="option">
                <input type="radio" name="q"> General Enquiry
            </label>

            <label class="option">
                <input type="radio" name="q"> Support Request
            </label>
        </div>

        <label>Message *</label>
        <textarea></textarea>

        <label class="check">
            <input type="checkbox"> I consent to being contacted by the team *
        </label>

        <button>Submit</button>

    </form>

</div>

</body>
</html>
