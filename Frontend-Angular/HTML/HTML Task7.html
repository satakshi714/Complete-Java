<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
</head>
<body>

<center>

<p>Please complete all the information below.</p>

<fieldset>
<legend>Sign Up Here</legend>

<form>

<table cellpadding="8">

<tr>
    <td>Name:</td>
    <td>
        <input type="text" placeholder="First Name">
        <input type="text" placeholder="Last Name">
    </td>
</tr>

<tr>
    <td>Email:</td>
    <td><input type="email" placeholder="Enter the email"></td>
</tr>

<tr>
    <td>Contact:</td>
    <td><input type="text" placeholder="Ex:1234567890"></td>
</tr>

<tr>
    <td>Set password:</td>
    <td><input type="password" placeholder="New password"></td>
</tr>

<tr>
    <td>Profile:</td>
    <td><input type="file"></td>
</tr>

<tr>
    <td></td>
    <td>
        <input type="submit" value="Submit">
    </td>
</tr>

</table>

</form>

</fieldset>

</center>

</body>
</html>
