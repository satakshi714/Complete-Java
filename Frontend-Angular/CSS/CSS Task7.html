<!DOCTYPE html>
<html>
<head>
    <title>Form UI</title>
    <link rel="stylesheet" href="./CSS Task7.css">
</head>
<body>

<div class="main">

    <div class="card">

        <div class="sidebar">
            <div class="step active">1<br><span>YOUR INFO</span></div>
            <div class="step">2<br><span>SELECT PLAN</span></div>
            <div class="step">3<br><span>ADD-ONS</span></div>
            <div class="step">4<br><span>SUMMARY</span></div>
        </div>

        <div class="content">
            <h2>Personal info</h2>
            <p>Please provide your name, email address, and phone number.</p>

            <label>Name</label>
            <input type="text" placeholder="e.g. Stephen King">

            <label>Email Address</label>
            <input type="email" placeholder="e.g. stephenking@lorem.com">

            <label>Phone Number</label>
            <input type="text" placeholder="e.g. +1 234 567 890">

            <button>Next Step</button>
        </div>

    </div>

</div>

</body>
</html>
